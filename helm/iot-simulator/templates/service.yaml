apiVersion: v1
kind: Service
metadata:
  name: {{ include "iot-simulator.fullname" . }}
  labels:
    {{- include "iot-simulator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.service.tcpEnabled }}
    - port: {{ .Values.service.tcpPort }}
      targetPort: tcp-json
      protocol: TCP
      name: tcp-json
      {{- if and (eq .Values.service.type "NodePort") .Values.service.tcpNodePort }}
      nodePort: {{ .Values.service.tcpNodePort }}
      {{- end }}
    {{- end }}
    {{- if .Values.service.coapEnabled }}
    - port: {{ .Values.service.coapPort }}
      targetPort: coap
      protocol: UDP
      name: coap
      {{- if and (eq .Values.service.type "NodePort") .Values.service.coapNodePort }}
      nodePort: {{ .Values.service.coapNodePort }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "iot-simulator.selectorLabels" . | nindent 4 }}
