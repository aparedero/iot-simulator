apiVersion: v1
kind: Service
metadata:
  name: {{ include "iot-simulator.fullname" . }}
  labels:
    {{- include "iot-simulator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # HTTP port — Web UI, REST API, WebSocket (/ws)
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.tcpEnabled }}
    # TCP/JSON ingress — accepts newline-delimited JSON payloads
    - port: {{ .Values.service.tcpPort }}
      targetPort: tcp-json
      protocol: TCP
      name: tcp-json
    {{- end }}
  selector:
    {{- include "iot-simulator.selectorLabels" . | nindent 4 }}
